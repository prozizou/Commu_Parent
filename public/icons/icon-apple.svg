<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Commu_Parent">
  <!-- Pas de coins arrondis ni de transparence : iOS applique lui-même le masque -->
  <!-- (coin arrondi + éventuelle ombre) sur l'apple-touch-icon, contrairement à Android. -->
  <rect width="512" height="512" fill="#1a2f45"/>
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220"
    font-weight="600"
    fill="#f7f4ee"
  >CP</text>
</svg>
